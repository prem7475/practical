openapi: 3.0.3
info:
  title: Experiment 7 Todo API
  version: 1.0.0
  description: In-memory Todo API used by the Postman collection.
servers:
  - url: http://localhost:5005/api
paths:
  /todos:
    get:
      summary: List todos
      responses:
        '200':
          description: Array of todos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Todo'
    post:
      summary: Create a todo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Todo created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Missing or blank title
  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a todo
      responses:
        '200':
          description: Todo found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          description: Todo not found
    put:
      summary: Replace a todo's editable fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, completed]
              properties:
                title:
                  type: string
                  minLength: 1
                completed:
                  type: boolean
      responses:
        '200':
          description: Todo updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          description: Invalid update
        '404':
          description: Todo not found
    delete:
      summary: Delete a todo
      responses:
        '204':
          description: Todo deleted
        '404':
          description: Todo not found
components:
  schemas:
    Todo:
      type: object
      required: [id, title, completed]
      properties:
        id:
          type: integer
        title:
          type: string
        completed:
          type: boolean
